(function() {
  // Track the last known path to avoid duplicate messages
  let lastPath = window.location.pathname;

  // Helper function to notify parent of route changes
  function notifyRouteChange(path) {
    if (path !== lastPath) {
      lastPath = path;
      window.parent.postMessage({
        id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
        type: 'ROUTE_CHANGED',
        path: path
      }, '*');
    }
  }

  // Override pushState
  const originalPushState = history.pushState;
  history.pushState = function() {
    originalPushState.apply(history, arguments);
    notifyRouteChange(window.location.pathname);
  };

  // Override replaceState
  const originalReplaceState = history.replaceState;
  history.replaceState = function() {
    originalReplaceState.apply(history, arguments);
    notifyRouteChange(window.location.pathname);
  };

  // Listen for popstate (browser back/forward)
  window.addEventListener('popstate', function() {
    notifyRouteChange(window.location.pathname);
  });

  // Listen for hash changes
  window.addEventListener('hashchange', function() {
    notifyRouteChange(window.location.pathname + window.location.hash);
  });

  // Also monitor clicks for client-side routing that might not use History API
  // This is a fallback for edge cases
  let checkInterval;
  document.addEventListener('click', function(e) {
    // Clear any existing interval
    if (checkInterval) clearInterval(checkInterval);

    // Check for route changes over the next 100ms
    let checks = 0;
    checkInterval = setInterval(function() {
      checks++;
      const currentPath = window.location.pathname;
      if (currentPath !== lastPath) {
        notifyRouteChange(currentPath);
        clearInterval(checkInterval);
      }
      // Stop checking after 10 attempts (100ms total)
      if (checks >= 10) {
        clearInterval(checkInterval);
      }
    }, 10);
  });

  // Notify parent of initial path on load
  window.addEventListener('load', function() {
    window.parent.postMessage({
      id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
      type: 'ROUTE_CHANGED',
      path: window.location.pathname
    }, '*');
  });
})();

<script>
let currentlyHighlightedElement = null;
let currentlyClickedElement = null;
let overlayElement = null;
let editModeOverlay = null;
let mousedownTarget = null;
let currentlyEditingElement = null;

window.isEditModeActive = false;

const findElementWithDataId = (x, y) => {
  // Get all elements with data-id
  const elements = document.querySelectorAll('[data-id]');

  // Convert to array and reverse to get top-most elements first
  const elementsArray = Array.from(elements).reverse();

  // Find the first element that contains the point
  for (const element of elementsArray) {
    const rect = element.getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      return element;
    }
  }
  return null;
}

const createEditModeOverlay = () => {
  const overlay = document.createElement('div');
  overlay.id = 'magic-patterns-edit-overlay';
  overlay.style.position = 'fixed';
  overlay.style.top = '0';
  overlay.style.left = '0';
  overlay.style.width = '100%';
  overlay.style.height = '100%';
  overlay.style.pointerEvents = 'all'; // Capture all events
  overlay.style.backgroundColor = 'transparent';
  overlay.style.zIndex = '999999998';
  return overlay;
}

const setOverlayToElement = (element) => {
    if (!overlayElement){
      overlayElement = document.createElement('div');
      overlayElement.id = 'magic-patterns-overlay';
      overlayElement.style.position = 'fixed';
      overlayElement.style.backgroundColor = 'transparent';
      overlayElement.style.zIndex = '999999999';
      overlayElement.style.pointerEvents = 'none';
      overlayElement.style.outline = '2px solid #5273E2';

      // Create tag label
      const tagLabel = document.createElement('div');
      tagLabel.id = 'magic-patterns-tag-label';
      tagLabel.style.position = 'absolute';
      tagLabel.style.top = '-22px';
      tagLabel.style.left = '-2px';
      tagLabel.style.backgroundColor = '#5273E2';
      tagLabel.style.color = '#fff';
      tagLabel.style.fontSize = '11px';
      tagLabel.style.fontFamily = 'system-ui, -apple-system, sans-serif';
      tagLabel.style.fontWeight = '500';
      tagLabel.style.padding = '2px 6px';
      tagLabel.style.borderRadius = '3px 3px 0 0';
      tagLabel.style.whiteSpace = 'nowrap';
      overlayElement.appendChild(tagLabel);

      document.body.appendChild(overlayElement);
    }

    const { x, y, width, height } = element.getBoundingClientRect();
    overlayElement.style.left = x + 'px'
    overlayElement.style.top = y + 'px'
    overlayElement.style.width = width + 'px'
    overlayElement.style.height = height + 'px'

    // Update tag label text
    const tagLabel = overlayElement.querySelector('#magic-patterns-tag-label');
    if (tagLabel) {
      tagLabel.textContent = element.tagName.toLowerCase();
    }
}

const handleVisualEditInput = (event) => {
  const element = event.target;
  if (!element || !element.dataset.id) return;

  window.parent.postMessage({
    id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
    type: 'TEXT_CONTENT_CHANGED',
    dataId: element.dataset.id,
    textContent: element.innerText || element.textContent || '',
  }, '*');
}

const cleanupContentEditable = () => {
  if (currentlyEditingElement) {
    currentlyEditingElement.removeAttribute('contenteditable');
    currentlyEditingElement.removeEventListener('input', handleVisualEditInput);
    currentlyEditingElement = null;
  }

  // Re-enable the overlay pointer events
  if (editModeOverlay) {
    editModeOverlay.style.pointerEvents = 'all';
  }
}

const makeElementContentEditable = (element) => {
  // Clean up previous contentEditable element
  cleanupContentEditable();

  // Disable the overlay so clicks can reach the contentEditable element
  if (editModeOverlay) {
    editModeOverlay.style.pointerEvents = 'none';
  }

  // Make the new element contentEditable
  element.setAttribute('contenteditable', 'true');
  element.addEventListener('input', handleVisualEditInput);
  currentlyEditingElement = element;

  // Focus the element
  element.focus();
}

const handleKeydown = (event) => {
  // Option+S / Alt+S to toggle select mode
  // macOS produces 'ß', Windows/Linux produce 's'
  if ((event.key === 'ß' || event.key === 's') && event.altKey) {
    if (window.isEditModeActive) {
      // Clean up any selected/editing elements
      cleanupContentEditable();
      if (overlayElement) {
        document.body.removeChild(overlayElement);
        overlayElement = null;
      }
      currentlyClickedElement = null;
      currentlyHighlightedElement = null;
      
      // Hide the popup and disable edit mode
      window.parent.postMessage({
        id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
        type: 'HIDE_POPUP',
      }, '*');
      disableEditMode();
    } else {
      enableEditMode();
    }
    return;
  }

  if (event.key === 'Escape') {
    // Handle edit mode escape
    if (currentlyEditingElement) {
      // First escape: deselect the element but stay in edit mode
      cleanupContentEditable();
      if (overlayElement) {
        document.body.removeChild(overlayElement);
        overlayElement = null;
      }
      currentlyClickedElement = null;
      currentlyHighlightedElement = null;
      window.parent.postMessage({
        id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
        type: 'UNSELECT_ELEMENT',
      }, '*');
      return;
    }

    if (currentlyClickedElement) {
      currentlyClickedElement = null;
      if (overlayElement) {
        document.body.removeChild(overlayElement);
        overlayElement = null;
      }
    } else if (currentlyHighlightedElement){
      disableEditMode()
    }

    window.parent.postMessage({
      id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
      type: 'UNSELECT_ELEMENT',
    }, '*')
  }
  else if (event.key === 'Shift') {
    const findParentWithDataId = (element) => {
      if (!element || !element.parentElement) return null;
      const parent = element.parentElement;
      return parent.hasAttribute('data-id') ? parent : findParentWithDataId(parent);
    }

    if (currentlyClickedElement) {
      const parentWithDataId = findParentWithDataId(currentlyClickedElement);
      if (parentWithDataId) {
        currentlyClickedElement = parentWithDataId;
        setOverlayToElement(currentlyClickedElement);
        currentlyHighlightedElement = currentlyClickedElement;
      }
    } else if (currentlyHighlightedElement){
      const parentWithDataId = findParentWithDataId(currentlyHighlightedElement);
      if (parentWithDataId) {
        currentlyHighlightedElement = parentWithDataId;
        setOverlayToElement(currentlyHighlightedElement);
      }
    }
  }
}

const handleMouseMove = (event) => {
  if (!window.isEditModeActive) return;
  event.preventDefault();

  const elementUnder = findElementWithDataId(event.clientX, event.clientY);

  if (elementUnder && !currentlyClickedElement) {
    setOverlayToElement(elementUnder);
    currentlyHighlightedElement = elementUnder;
  }
}

const handleMouseDown = (event) => {
  if (!window.isEditModeActive) return;
  event.preventDefault();

  mousedownTarget = findElementWithDataId(event.clientX, event.clientY);
}

const handleMouseUp = (event) => {
  if (!window.isEditModeActive) return;
  event.preventDefault();

  const { clientX, clientY } = event;
  const elementUnder = findElementWithDataId(clientX, clientY);

  // Only process if the mouseup target matches where we started the mousedown
  let elementToUse = mousedownTarget;
  mousedownTarget = null;

  if (!elementToUse) return;

  // If we have a highlighted element (from Shift key), use that instead
  if (currentlyHighlightedElement) {
    elementToUse = currentlyHighlightedElement;
  }

  if (elementToUse.dataset.id) {
    event.preventDefault();
    event.stopPropagation();

    currentlyClickedElement = elementToUse;
    currentlyHighlightedElement = elementToUse;

    setOverlayToElement(elementToUse);

    const elementRect = elementToUse.getBoundingClientRect();

    const elementX = clientX - elementRect.x;
    const elementY = clientY - elementRect.y;

    let elementInnerText = elementToUse.innerText
    if (!elementInnerText && ['input', 'textarea'].includes(elementToUse.tagName.toLowerCase())) {
      // Use placeholder for input or textarea elements
      elementInnerText = elementToUse.getAttribute('placeholder') || ''
    }

    // Get computed styles for visual editing
    const computedStyle = window.getComputedStyle(elementToUse);
    const computedStyles = {
      // Typography
      color: computedStyle.color,
      fontFamily: computedStyle.fontFamily,
      fontSize: computedStyle.fontSize,
      fontWeight: computedStyle.fontWeight,
      // Colors
      backgroundColor: computedStyle.backgroundColor,
      // Spacing
      padding: computedStyle.padding,
      paddingTop: computedStyle.paddingTop,
      paddingRight: computedStyle.paddingRight,
      paddingBottom: computedStyle.paddingBottom,
      paddingLeft: computedStyle.paddingLeft,
      margin: computedStyle.margin,
      marginTop: computedStyle.marginTop,
      marginRight: computedStyle.marginRight,
      marginBottom: computedStyle.marginBottom,
      marginLeft: computedStyle.marginLeft,
    };

    window.parent.postMessage({
      id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
      type: 'SELECT_ELEMENT',
      tagName: elementToUse.tagName,
      htmlSnippet: currentlyClickedElement.outerHTML,
      elementInnerText,
      computedStyles,
      coordinates: {
        x: clientX,
        y: clientY,
        // coordinates as a percentage of the element's bounding box from [0,1]
        elementXPercent: elementX / elementRect.width,
        elementYPercent: elementY / elementRect.height
      },
      dataId: elementToUse.dataset.id
    }, '*');
  } else {
    cleanupContentEditable();
    if (currentlyClickedElement) {
      currentlyClickedElement = null;
      document.body.removeChild(overlayElement);
      overlayElement = null;
    }

    window.parent.postMessage({
      id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
      type: 'UNSELECT_ELEMENT',
    }, '*');
  }
}

const enableEditMode = () => {
  window.isEditModeActive = true;
  if (overlayElement) {
    document.body.removeChild(overlayElement);
  }
  overlayElement = null;
  currentlyClickedElement = null;
  currentlyHighlightedElement = null;

  // Remove existing edit mode overlay
  if (editModeOverlay) {
    document.body.removeChild(editModeOverlay);
    editModeOverlay = null;
  }

  editModeOverlay = createEditModeOverlay();
  document.body.appendChild(editModeOverlay);

  // Add listeners to the overlay itself
  editModeOverlay.addEventListener('mousemove', handleMouseMove);
  editModeOverlay.addEventListener('mousedown', handleMouseDown);
  editModeOverlay.addEventListener('mouseup', handleMouseUp);

  window.focus();

  window.parent.postMessage({
    id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
    type: 'EDIT_MODE_ENABLED',
  }, '*');
}

const disableEditMode = () => {
  window.isEditModeActive = false;
  
  cleanupContentEditable();
  
  if (overlayElement) {
    document.body.removeChild(overlayElement);
  }
  if (editModeOverlay) {
    // Remove event listeners
    editModeOverlay.removeEventListener('mousemove', handleMouseMove);
    editModeOverlay.removeEventListener('mousedown', handleMouseDown);
    editModeOverlay.removeEventListener('mouseup', handleMouseUp);

    document.body.removeChild(editModeOverlay);
    editModeOverlay = null;
  }

  overlayElement = null;
  currentlyClickedElement = null;
  currentlyHighlightedElement = null;

  window.parent.postMessage({
    id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
    type: 'EDIT_MODE_DISABLED',
  }, '*');
}

window.addEventListener('message', event => {
  if (event.data.hasOwnProperty('isEditModeActive')) {
    if (event.data.isEditModeActive === false) {
      disableEditMode()
    } else if (event.data.isEditModeActive === true) {
      enableEditMode()
    }
  } else if (event.data.hasOwnProperty('clearSelection')) {
    cleanupContentEditable();
    if (overlayElement) {
      document.body.removeChild(overlayElement);
    }
    overlayElement = null;
    currentlyClickedElement = null;
    currentlyHighlightedElement = null;
  } else if (event.data.hasOwnProperty('highlightElementDataId')) {
    const dataId = event.data.highlightElementDataId
    const element = document.querySelector(`[data-id="${dataId}"]`)
    if (element) {
      element.classList.add('highlight-fade');

      setTimeout(() => {
        element.classList.remove('highlight-fade');
      }, 3000)
    }
  } else if (event.data.type === 'ENABLE_CONTENT_EDITABLE') {
    const { dataId } = event.data;
    const element = document.querySelector(`[data-id="${dataId}"]`);
    if (element) {
      makeElementContentEditable(element);
    }
  } else if (event.data.type === 'DISABLE_CONTENT_EDITABLE') {
    cleanupContentEditable();
  } else if (event.data.type === 'UPDATE_ELEMENT_STYLE') {
    // Visual Edit: Apply inline styles to element
    const { dataId, styles, textContent } = event.data;
    const element = document.querySelector(`[data-id="${dataId}"]`);
    if (element) {
      // Apply each style property (only if value is defined)
      if (styles) {
        Object.entries(styles).forEach(([property, value]) => {
          if (value !== undefined && value !== null) {
            element.style[property] = value;
          }
        });
      }
      // Update text content if provided
      if (textContent !== undefined) {
        // Only update if element has direct text (not nested elements)
        const hasOnlyTextChildren = Array.from(element.childNodes).every(
          node => node.nodeType === Node.TEXT_NODE || 
                  (node.nodeType === Node.ELEMENT_NODE && node.children.length === 0)
        );
        if (hasOnlyTextChildren) {
          element.textContent = textContent;
        }
      }
      // Update the overlay to match the new element size
      if (overlayElement && currentlyClickedElement && currentlyClickedElement.dataset.id === dataId) {
        // Use requestAnimationFrame to let the DOM update first
        requestAnimationFrame(() => {
          setOverlayToElement(element);
        });
      }
    }
  }
});

window.addEventListener('keydown', handleKeydown);
</script>

window.isCommentModeActive = false

const createCommentCursorSvg = (avatarDataUrl) => {
  // Matches CommentBubbleIcon shape scaled from 24x24 to 32x32
  // Path M5 19 V10 A8 8 0 1 1 14 19 H5 Z → scaled to M7 25 V13 A11 11 0 1 1 19 25 H7 Z

const loadAvatarAndCreateCursor = async (avatarUrl) => {

  try {

const findCommentElementWithDataId = (x, y) => {
  // Get all elements with data-id
  const elements = document.querySelectorAll('[data-id]')

  // Convert to array and reverse to get top-most elements first
  const elementsArray = Array.from(elements).reverse()

  // Find the first element that contains the point
  for (const element of elementsArray) {
    const rect = element.getBoundingClientRect()
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      return element
    }
  }
  return null
}

const createCommentModeOverlay = () => {

  overlay.style.left = '0'
  overlay.style.width = '100%'
  overlay.style.height = '100%'
  overlay.style.pointerEvents = 'all'
  overlay.style.backgroundColor = 'transparent'
  overlay.style.zIndex = '999999998'

}

function isCommentTypingInInput() {

  const isTyping = activeElement && (
    tagName === 'input' ||
    tagName === 'textarea' ||
    activeElement.isContentEditable

const handleCommentKeydown = (event) => {
  if (event.key === 'Escape') {
    if (window.isCommentModeActive) {
      disableCommentMode()

    window.parent.postMessage({
      id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
      type: 'COMMENT_HIDE_POPUP',
    }, '*')
  }
  // Toggle comment mode with 'c' key
  else if ((event.key === 'c' || event.key === 'C') && !event.metaKey && !event.altKey && !event.ctrlKey) {
    if (isCommentTypingInInput()) {
      return
    }

    if (window.isCommentModeActive) {
      disableCommentMode()
    } else {
      enableCommentMode()
    }
  }
  // Toggle comments visibility with 'h' key
  else if ((event.key === 'h' || event.key === 'H') && !event.metaKey && !event.altKey && !event.ctrlKey) {
    if (isCommentTypingInInput()) {
      return
    }

    window.parent.postMessage({
      id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
      type: 'TOGGLE_COMMENTS_VISIBILITY',

const handleCommentMouseDown = (event) => {

const handleCommentMouseUp = (event) => {

    event.preventDefault()
    event.stopPropagation()

    const elementRect = elementToUse.getBoundingClientRect()

    const elementX = clientX - elementRect.x
    const elementY = clientY - elementRect.y

    let elementInnerText = elementToUse.innerText
    if (!elementInnerText && ['input', 'textarea'].includes(elementToUse.tagName.toLowerCase())) {
      // Use placeholder for input or textarea elements
      elementInnerText = elementToUse.getAttribute('placeholder') || ''

      id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
      type: 'COMMENT_ON_ELEMENT',

      coordinates: {

        elementXPercent: elementX / elementRect.width,

    window.parent.postMessage({
      id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
      type: 'COMMENT_HIDE_POPUP',
    }, '*')

const enableCommentMode = async (avatarUrl) => {

  commentCursorDataUrl = await loadAvatarAndCreateCursor(avatarUrl)

  if (commentModeOverlay) {

  commentModeOverlay = createCommentModeOverlay()
  document.body.appendChild(commentModeOverlay)

  // Add listeners to the overlay itself
  commentModeOverlay.addEventListener('mousedown', handleCommentMouseDown)
  commentModeOverlay.addEventListener('mouseup', handleCommentMouseUp)

const disableCommentMode = () => {
  window.isCommentModeActive = false
  
  if (commentModeOverlay) {

    commentModeOverlay.removeEventListener('mousedown', handleCommentMouseDown)
    commentModeOverlay.removeEventListener('mouseup', handleCommentMouseUp)

    id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
    type: 'COMMENT_MODE_DISABLED',
  }, '*')
}

window.addEventListener('message', event => {
  if (event.data.hasOwnProperty('isCommentModeActive')) {
    if (event.data.isCommentModeActive === false) {
      disableCommentMode()
    } else if (event.data.isCommentModeActive === true) {
      // Pass avatarUrl from the message to enableCommentMode
      enableCommentMode(event.data.avatarUrl)
    }
  }
})

window.addEventListener('keydown', handleCommentKeydown)

document.addEventListener('click', function(event){

    // Traverse up the DOM tree
    while (target && target !== document) {
        const prototypeId = target.getAttribute('data-prototypeId');
        if (prototypeId) {
            event.preventDefault();
            event.stopPropagation();

            window.parent.postMessage({
                id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
                type: 'PROTOTYPE_TARGET_CLICKED',
                prototypeId,
                nodeId: 'bd18ee34-0386-4a03-b207-7601c3c83c02'
            }, '*');
            
            break; // Exit the loop once we've found and processed a matching element
        }
        target = target.parentElement; // Move up to the parent element
    }
})

  let elementInnerText = element.innerText
  if (!elementInnerText && ['input', 'textarea'].includes(element.tagName.toLowerCase())) {
    // Use placeholder for input or textarea elements
    elementInnerText = element.getAttribute('placeholder') || ''
  }

  return Object.fromEntries(elementIdentifiers.map(({ dataId, innerText }) => {
    const matchingElements = Array.from(document.querySelectorAll('[data-id="' + dataId + '"]'))

    if (matchingElements.length > 0) {
      const key = createElementIdentifierKey(dataId, innerText)
      const matchedElement = matchingElements.find(element => getElementText(element) === innerText) ?? matchingElements[0]

      return [key, matchedElement.getBoundingClientRect()]

    return

    id: 'bd18ee34-0386-4a03-b207-7601c3c83c02',
    type: 'ELEMENT_RECTS',

    if (trackedElementIdentifiers.length === 0) {

      return

    animationFrameId = requestAnimationFrame(loop)

}

  if (animationFrameId !== null) {
    cancelAnimationFrame(animationFrameId)
    animationFrameId = null

    trackedElementIdentifiers = event.data.trackedElementIdentifiers
    if (trackedElementIdentifiers.length > 0) {
